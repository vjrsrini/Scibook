<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="scibook-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="scibook-glow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-2" y="0" width="68" height="68" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#scibook-bg)" filter="url(#shadow)"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="14.25" stroke="url(#scibook-glow)" stroke-width="1.5"/>
  
  <!-- Microscope Instrument Graphics -->
  <!-- Eyepiece / Barrel -->
  <path d="M22 17 L29 24" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="23" y="16" width="13" height="6.5" rx="2" transform="rotate(45 23 16)" fill="#ffffff"/>
  <!-- Revolving Nosepiece / Objective Lens -->
  <path d="M33 28 L37 32" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
  <!-- Stage (Sample Plate) -->
  <path d="M25 38 H46" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Laser / Focus Point -->
  <circle cx="36" cy="38" r="2.2" fill="#38bdf8"/>
  <circle cx="36" cy="38" r="4.5" stroke="#7dd3fc" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Curved Arm / C-Stand -->
  <path d="M24 22 C14 26, 14 43, 27 47 H44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Base Stand -->
  <path d="M18 50 H47" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
</svg>